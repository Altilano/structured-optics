[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structured_optics"
version = "0.3"
description = "Package for Structured Light simulation"
requires-python = ">=3.9"
authors = [
    { name = "Altilano C. Barbosa" }
]

dependencies = [
    "numpy",
    "scipy",
    "PyQt6"
]
