name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one failing combination must not hide the others
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package (non-editable, like a user would) plus pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Show the resolved versions
        run: python -m pip list

      # Plain `pytest` (not `python -m pytest`) keeps the repo root off sys.path,
      # so the tests exercise the installed package rather than the source folder.
      - name: Run the test-suite
        run: pytest
