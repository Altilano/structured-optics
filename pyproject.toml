[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structured_optics"
version = "0.6.4"
description = "Package for Structured Light simulation"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    { name = "Altilano C. Barbosa" }
]

dependencies = [
    "numpy",
    "scipy",
    "screeninfo"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Surface API deprecations raised from our own code before a NumPy/SciPy upgrade breaks it.
    "error::DeprecationWarning:structured_optics",
    "error::FutureWarning:structured_optics",
]

[tool.setuptools]
packages = ["structured_optics"]